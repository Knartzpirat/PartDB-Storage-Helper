# Labeltool auf Unraid/Linux. Das Image baut GitHub automatisch (.github/workflows/docker.yml):
#   docker compose pull && docker compose up -d
# Image-Name = ghcr.io/<github-benutzer>/<repository> (klein geschrieben) – bei anderem Repository-Namen anpassen.
services:
  labeltool:
    image: ghcr.io/knartzpirat/partdb-storage-helper:latest
    # Statt des fertigen Images selbst bauen: die nächsten Zeilen einkommentieren, dann
    #   docker compose up -d --build
    # build:
    #   context: .
    #   args:
    #     PUID: "99"     # Unraid: nobody
    #     PGID: "100"    # Unraid: users
    container_name: labeltool
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      TZ: Europe/Berlin
      PARTDB_URL: ""     # optional Startwert, z. B. http://partdb.lan:8080 (später im Reiter Einstellungen änderbar)
      PARTDB_TOKEN: ""   # optional Startwert
    volumes:
      - /mnt/user/appdata/labeltool/config:/config
      - /mnt/user/appdata/labeltool/ausgabe:/ausgabe
      - /mnt/user/appdata/labeltool/vorlagen:/vorlagen

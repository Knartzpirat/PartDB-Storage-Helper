# Testet das Labeltool und veröffentlicht das Docker-Image in der GitHub Container Registry.
#
#   Push auf main      -> ghcr.io/<besitzer>/<repo>:latest  (+ :sha-<commit>)
#   Tag v1.2.3         -> :1.2.3, :1.2 und :latest
#   Pull-Request       -> nur testen und bauen, nichts veröffentlichen
#
# Unraid lädt danach einfach das Image (Docker-Tab -> "Update"), lokales Bauen entfällt.
name: Docker-Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt pytest

      # Windows-spezifische Tests (b-PAC, P-touch Editor, Autostart) überspringen sich unter Linux selbst
      - name: Tests
        run: python -m pytest tests -q -p no:warnings -rs

  image:
    name: Image bauen und veröffentlichen
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # Schreiben nach ghcr.io mit dem automatischen GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Bei ghcr.io anmelden
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image-Name = ghcr.io/<besitzer>/<repo>, automatisch kleingeschrieben
      - name: Tags und Labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=Part-DB Labeltool
            org.opencontainers.image.description=Lagerboxen in Part-DB anlegen und Labels für den Brother PT-P710BT erzeugen

      - name: Bauen (und bei main/Tags veröffentlichen)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64     # Unraid läuft auf x86-64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

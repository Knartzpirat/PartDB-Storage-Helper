# Testet das Labeltool und veröffentlicht das Docker-Image in der GitHub Container Registry.
#
#   Push auf main      -> ghcr.io/<besitzer>/<repo>:latest  (+ :sha-<commit>)
#   Tag v1.2.3         -> :1.2.3, :1.2 und :latest
#   Pull-Request       -> nur testen und bauen, nichts veröffentlichen
#
# Der Job "installer" baut auf Windows den Druck-Helfer-Installer (PyInstaller + Inno Setup,
# installer/build.ps1) -> Artefakt "Labeltool-Helfer-Setup". Das Image enthält ihn unter
# /app/helfer-installer/Labeltool-Helfer-Setup.exe (Download über GET /api/helfer/installer);
# bei Tags v* kommt er zusätzlich als Asset ans GitHub-Release.
# Der Job "version" bestimmt EINE Build-Version (Tag v1.2.3 -> 1.2.3, sonst 0.0.0-<Commit>) für
# Installer (build.ps1 -Version, Labeltool-Helfer-Setup.version im Artefakt) und Image (Build-Arg VERSION).
#
# Unraid lädt danach einfach das Image (Docker-Tab -> "Update"), lokales Bauen entfällt.
name: Docker-Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Eine Build-Version für Installer und Image: Tag v1.2.3 -> 1.2.3, sonst 0.0.0-<kurzer Commit>
  version:
    name: Version bestimmen
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Version bestimmen
        id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "$REF_TYPE" == "tag" && "$REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.+_-]*)$ ]]; then
            v="${BASH_REMATCH[1]}"
          else
            v="0.0.0-${SHA:0:7}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"

  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt pytest

      # Windows-spezifische Tests (b-PAC, P-touch Editor, Autostart) überspringen sich unter Linux selbst
      - name: Tests
        run: python -m pytest tests -q -p no:warnings -rs

  installer:
    name: Windows-Installer (Druck-Helfer)
    needs: [version]
    runs-on: windows-latest
    permissions:
      contents: write          # nur für das Release-Asset bei Tags
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Abhängigkeiten installieren
        run: python -m pip install -r requirements.txt pyinstaller

      # Inno Setup ist auf den Windows-Runnern nicht immer vorinstalliert
      - name: Inno Setup bereitstellen
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { choco install innosetup -y --no-progress }

      # Version aus dem Job "version" (dieselbe bekommt das Image als Build-Arg)
      - name: Installer bauen
        run: ./installer/build.ps1 -Python python -Version "${{ needs.version.outputs.version }}" -OhneWinget

      # Selbsttest des gepackten Programms (ohne b-PAC/Drucker: nur Bundle-Inhalt prüfen)
      - name: Gepacktes Programm prüfen
        env:
          LABELTOOL_HELFER_STILL: "1"
        run: |
          $ziel = Join-Path $env:RUNNER_TEMP "inst"
          $p = Start-Process installer/dist/Labeltool-Helfer-Setup.exe -Wait -PassThru -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', "/DIR=`"$ziel`"", '/TASKS=""'
          if ($p.ExitCode -ne 0) { throw "Setup fehlgeschlagen ($($p.ExitCode))" }
          foreach ($exe in 'LabeltoolHelfer.exe', 'LabeltoolHelferSetup.exe', 'unins000.exe') {
            if (-not (Test-Path (Join-Path $ziel $exe))) { throw "$exe fehlt nach der Installation" }
          }
          $env:LABELTOOL_HELFER_DIR = Join-Path $env:RUNNER_TEMP "helferdaten"
          $json = Join-Path $env:RUNNER_TEMP "diagnose.json"
          Start-Process (Join-Path $ziel 'LabeltoolHelfer.exe') -ArgumentList '--diagnose', "`"$json`"" -Wait
          $d = Get-Content $json -Raw | ConvertFrom-Json
          $d | ConvertTo-Json -Depth 5
          if (-not $d.gepackt -or $d.websockets -ne $true -or $d.tkinter -ne $true -or $d.modelle_anzahl -lt 10) {
            throw "Bundle unvollständig"
          }
          if ($d.version -ne "${{ needs.version.outputs.version }}") { throw "Falsche Version im Bundle: $($d.version)" }
          if ((Get-Content installer/dist/Labeltool-Helfer-Setup.version -Raw).Trim() -ne "${{ needs.version.outputs.version }}") {
            throw "Labeltool-Helfer-Setup.version passt nicht"
          }
          $p = Start-Process (Join-Path $ziel 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Deinstallation fehlgeschlagen ($($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        with:
          name: Labeltool-Helfer-Setup
          path: |
            installer/dist/Labeltool-Helfer-Setup.exe
            installer/dist/Labeltool-Helfer-Setup.version
          if-no-files-found: error
          retention-days: 30

      - name: Release-Asset (nur Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/dist/Labeltool-Helfer-Setup.exe

  image:
    name: Image bauen und veröffentlichen
    needs: [version, test, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # Schreiben nach ghcr.io mit dem automatischen GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4

      # Setup-Datei aus dem Job "installer" -> Build-Kontext "helfer-installer" (s. Dockerfile)
      - uses: actions/download-artifact@v4
        with:
          name: Labeltool-Helfer-Setup
          path: ${{ runner.temp }}/helfer-installer

      - uses: docker/setup-buildx-action@v3

      - name: Bei ghcr.io anmelden
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image-Name = ghcr.io/<besitzer>/<repo>, automatisch kleingeschrieben
      - name: Tags und Labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=Part-DB Labeltool
            org.opencontainers.image.description=Lagerboxen in Part-DB anlegen und Labels für den Brother PT-P710BT erzeugen

      - name: Bauen (und bei main/Tags veröffentlichen)
        uses: docker/build-push-action@v6
        with:
          context: .
          build-contexts: |
            helfer-installer=${{ runner.temp }}/helfer-installer
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          platforms: linux/amd64     # Unraid läuft auf x86-64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
